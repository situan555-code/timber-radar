<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timber Radar</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <span class="eyebrow">TIMBER RADAR</span>
        <span class="score-badge" id="score-version-badge">score v0.95</span>
      </div>
      <div id="layer-controls" class="layer-controls">
        <label><input type="checkbox" id="layer-score" checked /> Opportunity score</label>
        <label><input type="checkbox" id="layer-boundaries" checked /> Boundaries</label>
        <label><input type="checkbox" id="layer-chm" /> Tree height (CHM)</label>
        <label><input type="checkbox" id="layer-roads" /> Roads</label>
      </div>
      <button id="shortlist-toggle" class="pill-button" type="button">Shortlist (<span id="shortlist-count">0</span>)</button>
    </header>

    <div id="map"></div>

    <aside id="sidebar">
      <div id="filters" class="section">
        <button id="filters-toggle" class="section-header" type="button" aria-expanded="false">
          Filters <span class="chev">▾</span>
        </button>
        <div id="filters-body" class="section-body" hidden>
          <label class="filter-row">Min timber score
            <input type="range" id="f-score" min="0" max="100" value="0" />
            <span class="filter-value" id="f-score-val">0</span>
          </label>
          <label class="filter-row">Min parcel acres
            <input type="number" id="f-acres" min="0" value="0" />
          </label>
          <label class="filter-row">Min wooded acres
            <input type="number" id="f-wooded" min="0" value="0" />
          </label>
          <label class="filter-row">Min canopy p90 (ft)
            <input type="number" id="f-canopy" min="0" value="0" />
          </label>
          <label class="filter-row">Max road distance (ft)
            <input type="number" id="f-road" min="0" placeholder="no limit" />
          </label>
          <label class="filter-row">Min continuity %
            <input type="range" id="f-continuity" min="0" max="100" value="0" />
            <span class="filter-value" id="f-continuity-val">0%</span>
          </label>
          <label class="filter-check"><input type="checkbox" id="f-full-coverage" /> Full-coverage only (95%)</label>
          <label class="filter-check"><input type="checkbox" id="f-exclude-fallback" /> Exclude road-distance fallback</label>
          <button id="filters-reset" class="text-button" type="button">Reset filters</button>
        </div>
      </div>

      <div id="signals" class="section">
        <div class="section-header signals-header">
          <div class="signals-tabs">
            <button type="button" class="signals-tab" id="signals-tab-activity" data-view="activity">Activity</button>
            <button type="button" class="signals-tab" id="signals-tab-market" data-view="market">Market</button>
          </div>
        </div>

        <div id="activity-body" class="section-body" hidden>
          <div class="muted" id="activity-map-summary" style="padding:8px 12px 0"></div>
          <div class="activity-map-legend">
            <span><i class="dot transfer"></i>Recent transfer</span>
            <span><i class="dot delinquent"></i>Delinquent</span>
            <span><i class="dot delinquent-changed"></i>Amount changed</span>
          </div>
          <div class="pill-row" id="activity-recency-pills">
            <button type="button" class="pill-toggle" data-recency="7">7 days</button>
            <button type="button" class="pill-toggle" data-recency="30">30 days</button>
            <button type="button" class="pill-toggle active" data-recency="90">90 days</button>
            <button type="button" class="pill-toggle" data-recency="all">All</button>
          </div>
          <div class="pill-row" id="activity-type-pills">
            <button type="button" class="pill-toggle active" data-type="all">All</button>
            <button type="button" class="pill-toggle" data-type="transfer">Transfer / Sale</button>
            <button type="button" class="pill-toggle" data-type="delinquent">Tax delinquent</button>
          </div>
          <div class="pill-row" id="activity-county-pills">
            <button type="button" class="pill-toggle active" data-county="all">All counties</button>
            <button type="button" class="pill-toggle" data-county="Holmes">Holmes</button>
            <button type="button" class="pill-toggle" data-county="Tuscarawas">Tuscarawas</button>
          </div>
          <button type="button" id="activity-more-filters-toggle" class="text-button">More filters ▾</button>
          <div id="activity-more-filters" class="section-body" hidden>
            <label class="filter-row">Min timber score
              <input type="number" id="activity-min-score" min="0" max="100" value="0" />
            </label>
            <label class="filter-row">Min wooded acres
              <input type="number" id="activity-min-wooded" min="0" value="0" />
            </label>
          </div>
          <div class="muted" id="activity-summary"></div>
          <div id="activity-list" class="activity-card-list"></div>
          <div class="freshness-footer" id="activity-freshness"></div>
        </div>

        <div id="market-body" class="section-body" hidden>
          <div id="market-prices"></div>
          <div id="market-cutsold"></div>
        </div>
      </div>

      <div id="list-view" class="section grow">
        <div class="section-header static">
          <span id="result-count">5792 parcels</span>
          <span class="muted">sorted by score ↓</span>
        </div>
        <div id="ranked-list" class="ranked-list"></div>
      </div>
    </aside>

    <div id="detail-panel" class="overlay-panel" hidden>
      <button id="detail-close" class="icon-button" type="button" aria-label="Close">✕</button>
      <div id="detail-body"></div>
    </div>

    <div id="tree-detail-panel" class="overlay-panel" hidden>
      <button id="tree-detail-close" class="icon-button" type="button" aria-label="Close">✕</button>
      <div id="tree-detail-body"></div>
    </div>

    <div id="lidar-mode-strip" class="lidar-mode-strip" hidden>
      <button type="button" data-mode="canopy" class="lidar-mode-btn active">Canopy</button>
      <button type="button" data-mode="height" class="lidar-mode-btn">Elevation</button>
      <button type="button" data-mode="classified" class="lidar-mode-btn">Classified</button>
    </div>

    <div id="shortlist-drawer" class="overlay-panel" hidden>
      <div class="drawer-header">
        <span>Shortlist</span>
        <button id="shortlist-close" class="icon-button" type="button" aria-label="Close">✕</button>
      </div>
      <div id="shortlist-body" class="shortlist-body"></div>
      <div class="drawer-actions">
        <button id="shortlist-export-csv" class="text-button" type="button">Export CSV</button>
        <button id="shortlist-export-geojson" class="text-button" type="button">Export GeoJSON</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.0.7/dist/pmtiles.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
